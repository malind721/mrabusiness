<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dati cliente | M.R.A. Business</title>

  <meta
    name="description"
    content="Inserisci i tuoi dati per procedere all'acquisto."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --ink: #f3f0ff;
      --muted: #b7afd4;
      --bg: #080916;
      --panel: #11142b;
      --accent: #9f7aff;
      --line: rgba(185,164,255,0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(118,72,255,0.28),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #0e1230,
          #080916 55%,
          #03040b
        );

      color: var(--ink);

      font-family: "Manrope", sans-serif;
    }

    .container {

      width: 100%;
      max-width: 560px;
    }

    .back {

      display: inline-block;

      margin-bottom: 30px;

      color: var(--muted);

      text-decoration: none;

      font-size: 0.9rem;

      font-weight: 700;
    }

    .back:hover {
      color: var(--ink);
    }

    .card {

      padding: 40px;

      border: 1px solid var(--line);

      border-radius: 18px;

      background:
        rgba(17,20,43,0.92);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.4);
    }

    .eyebrow {

      margin-bottom: 14px;

      color: var(--accent);

      font-size: 0.75rem;

      font-weight: 800;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }

    h1 {

      margin-bottom: 14px;

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(2.5rem, 8vw, 4rem);

      line-height: 0.98;
    }

    h1 span {

      color: var(--accent);

      font-style: italic;
    }

    .intro {

      margin-bottom: 32px;

      color: var(--muted);

      line-height: 1.6;
    }

    .field {

      margin-bottom: 18px;
    }

    label {

      display: block;

      margin-bottom: 8px;

      font-size: 0.85rem;

      font-weight: 800;
    }

    input {

      width: 100%;

      padding: 15px 16px;

      border: 1px solid var(--line);

      border-radius: 10px;

      outline: none;

      background:
        rgba(8,9,22,0.8);

      color: var(--ink);

      font-family: inherit;

      font-size: 0.95rem;

      transition:
        border-color 200ms ease,
        box-shadow 200ms ease;
    }

    input:focus {

      border-color:
        rgba(159,122,255,0.75);

      box-shadow:
        0 0 20px
        rgba(159,122,255,0.12);
    }

    input::placeholder {
      color: #756d91;
    }

    .button {

      width: 100%;

      margin-top: 12px;

      padding: 17px 22px;

      border: 1px solid
        rgba(159,122,255,0.5);

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          rgba(159,122,255,0.25),
          rgba(94,59,214,0.12)
        );

      color: var(--ink);

      font-family: inherit;

      font-size: 0.9rem;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 200ms ease,
        background 200ms ease,
        box-shadow 200ms ease;
    }

    .button:hover {

      transform: translateY(-3px);

      background:
        rgba(159,122,255,0.2);

      box-shadow:
        0 10px 35px
        rgba(159,122,255,0.15);
    }

    .secure {

      margin-top: 18px;

      color: var(--muted);

      font-size: 0.75rem;

      text-align: center;
    }

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      .card {
        padding: 28px 22px;
      }

    }

  </style>

</head>

<body>

  <main class="container">

    <a
      href="javascript:history.back()"
      class="back"
    >
      ← Torna indietro
    </a>

    <section class="card">

      <p class="eyebrow">
        M.R.A. Business
      </p>

      <h1>
        Inserisci i tuoi
        <span>dati.</span>
      </h1>

      <p class="intro">
        Inserisci i tuoi dati per procedere
        al pagamento del servizio.
      </p>

      <form id="customer-form">

  <div class="field">

    <label for="nome">
      Nome e cognome *
    </label>

    <input
      id="nome"
      name="nome"
      type="text"
      placeholder="Mario Rossi"
      required
    >

  </div>


  <div class="field">

    <label for="attivita">
      Nome attività *
    </label>

    <input
      id="attivita"
      name="attivita"
      type="text"
      placeholder="La tua attività"
      required
    >

  </div>


  <div class="field">

    <label for="email">
      Email *
    </label>

    <input
      id="email"
      name="email"
      type="email"
      placeholder="mario@email.it"
      required
    >

  </div>


  <div class="field">

    <label for="telefono">
      Numero di telefono *
    </label>

    <input
      id="telefono"
      name="telefono"
      type="tel"
      placeholder="+39 333 1234567"
      required
    >

  </div>


  <button
    type="submit"
    class="button"
    id="submit-button"
  >
    Continua al pagamento →
  </button>

</form>

      <p class="secure">
        🔒 Pagamento sicuro tramite Stripe
      </p>

    </section>

  </main>

  <script>

const form = document.getElementById("customer-form");
const button = document.getElementById("submit-button");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  button.disabled = true;
  button.textContent = "Preparazione del pagamento...";

  const dati = {

    nome: document.getElementById("nome").value.trim(),

    attivita: document.getElementById("attivita").value.trim(),

    email: document.getElementById("email").value.trim(),

    telefono: document.getElementById("telefono").value.trim()

  };

  try {

    const response = await fetch(
      "https://mrabusiness-sitoweb-base.malindranasinghe.workers.dev/checkout",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(dati)
      }
    );

    const result = await response.json();

    if (result.url) {

      window.location.href = result.url;

    } else {

      throw new Error(
        result.error || "Errore durante la creazione del pagamento"
      );

    }

  } catch (error) {

    console.error(error);

    alert(
      "Si è verificato un errore. Riprova tra qualche secondo."
    );

    button.disabled = false;

    button.textContent =
      "Continua al pagamento →";

  }

});

</script>

</body>

</html>
